<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>НСПК</title>
    
    <!-- PWA Настройки -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png"> <!-- Если добавите иконку с таким именем -->

    <style>
        :root {
            --bg-main: #000000;
            --bg-app: #0d0e12;
            --bg-card: #1a1b1e;
            --bg-btn: #1a2636;
            --text-main: #ffffff;
            --text-muted: #8e929b;
            --blue-accent: #4b97f6; /* Цвет стрелки и кнопок */
            --blue-bg: #1a283b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-main);
            /* Отступ для челки iPhone */
            padding-top: env(safe-area-inset-top);
        }

        .app-container {
            background-color: var(--bg-app);
            width: 100%;
            max-width: 400px;
            min-height: 100vh;
            padding: 10px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- ВЕРХНЯЯ ПАНЕЛЬ (КАК НА СКРИНШОТЕ) --- */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0 30px 0;
            position: relative;
        }

        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            margin-left: -10px;
        }

        .back-btn svg {
            width: 28px;
            height: 28px;
            fill: var(--blue-accent);
        }

        /* Контейнер для даты и времени */
        .date-time-wrapper {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 250px;
            text-align: center;
        }

        .date-time-text {
            font-size: 22px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            display: inline-block;
            pointer-events: none; /* Чтобы клик проходил на прозрачный инпут поверх */
        }

        /* Прозрачный нативный инпут, который лежит поверх текста для вызова системного пикера */
        .hidden-datetime-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            /* На некоторых браузерах нужно принудительно растянуть */
            font-size: 100px; 
        }

        /* --- ОСТАЛЬНОЙ ИНТЕРФЕЙС (БЕЗ ИЗМЕНЕНИЙ) --- */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 16px;
            margin-top: 20px;
        }

        .logo-circle {
            width: 100px;
            height: 100px;
            background-color: #e6f5ed;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
        }

        .logo-shape {
            width: 50px;
            height: 22px;
            background-color: #007e46;
            border-top-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        .app-title {
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .category-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }

        .category-pill {
            background-color: var(--blue-bg);
            color: var(--blue-accent);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn-circle {
            width: 34px;
            height: 34px;
            background-color: var(--blue-bg);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .icon-btn-circle svg { width: 16px; height: 16px; fill: var(--blue-accent); }

        .amount {
            font-size: 56px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 32px;
            letter-spacing: -1.5px;
        }

        .actions-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .action-btn {
            flex: 1;
            background-color: var(--bg-btn);
            border-radius: 18px;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: none;
            cursor: pointer;
        }

        .action-btn:active { opacity: 0.7; }
        .action-btn svg { width: 26px; height: 26px; fill: var(--blue-accent); }
        .action-btn span { color: var(--blue-accent); font-size: 13px; text-align: center; }

        .transaction-card {
            background-color: var(--bg-card);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 28px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title { font-size: 20px; font-weight: 400; }
        .card-link { color: var(--blue-accent); font-size: 15px; text-decoration: none; }

        .card-body { display: flex; align-items: center; gap: 16px; }

        .thumbnail {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #222;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            padding: 4px;
        }
        
        .thumbnail::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(120deg, #444, #111);
        }

        .thumbnail-text {
            position: relative;
            z-index: 2;
            color: #fff;
            font-size: 9px;
            font-weight: 500;
            line-height: 1;
        }

        .merchant-info { display: flex; align-items: center; gap: 10px; }
        .merchant-name { font-size: 18px; font-weight: 400; }

        .speaker-icon {
            width: 22px;
            height: 22px;
            background: #333;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .speaker-icon svg { width: 12px; height: 12px; fill: #ccc; }

        .recommendations-title {
            font-size: 22px;
            font-weight: 400;
            margin-bottom: 16px;
        }

        .recommendations-grid { display: flex; gap: 12px; }

        .rec-card {
            flex: 1;
            border-radius: 16px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            min-height: 220px;
        }

        .rec-card.blue-card {
            background: linear-gradient(145deg, #10386b, #081a33);
            border: 1px solid #1c4b82;
        }

        .rec-card.white-card {
            background: #ffffff;
            color: #000000;
            border: 1px solid #e0e0e0;
        }

        .rec-card .sub-label {
            font-size: 9px;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .blue-card .sub-label { color: #8fb8ea; }
        .white-card .sub-label { color: #666; }

        .rec-card .title {
            font-size: 16px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 12px;
            z-index: 2;
        }

        .blue-card .title { color: #ffffff; }
        .white-card .title { color: #004b99; }

        .rec-card .badge {
            background: #ffcc00;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 6px;
            border-radius: 4px;
            align-self: flex-start;
            z-index: 2;
            margin-top: auto;
        }

        .box-decor {
            position: absolute;
            bottom: -30px;
            right: -20px;
            width: 140px;
            height: 140px;
            border-radius: 20px;
            transform: rotate(-20deg);
            z-index: 1;
        }

        .blue-card .box-decor { background: #1e5c9e; opacity: 0.4; }
        .white-card .box-decor { background: #e5f0fa; opacity: 0.8; }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- ВЕРХНЯЯ ПАНЕЛЬ С ДАТОЙ И ВРЕМЕНЕМ -->
    <div class="top-nav">
        <button class="back-btn" onclick="history.back()">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
        </button>
        
        <div class="date-time-wrapper">
            <span class="date-time-text" id="displayDateTime">Загрузка...</span>
            <!-- Скрытый нативный инпут для выбора даты и времени -->
            <input type="datetime-local" id="nativeDateTime" class="hidden-datetime-input">
        </div>
        
        <div style="width: 28px;"></div> <!-- Пустой блок для баланса -->
    </div>

    <!-- ЛОГОТИП -->
    <div class="header">
        <div class="logo-circle">
            <div class="logo-shape"></div>
        </div>
        <div class="app-title">НСПК</div>
    </div>

    <!-- КАТЕГОРИЯ -->
    <div class="category-row">
        <div class="category-pill">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/>
            </svg>
            Транспорт • MCC 4131
        </div>
        <div class="icon-btn-circle">
            <svg viewBox="0 0 24 24">
                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
            </svg>
        </div>
    </div>

    <!-- СУММА -->
    <div class="amount">−88 ₽</div>

    <!-- ДЕЙСТВИЯ -->
    <div class="actions-grid">
        <button class="action-btn">
            <svg viewBox="0 0 24 24">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                <line x1="3" y1="3" x2="21" y2="21" stroke="#4b97f6" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <span>Не учитывать</span>
        </button>
        <button class="action-btn">
            <svg viewBox="0 0 24 24">
                <path d="M1 21h12v2H1zM5.24 17.77l1.41-1.41 4.24-4.24 3.54 3.54-4.24 4.24-1.41 1.41-3.54-3.54zM15.26 6.52l-1.41-1.41c-.39-.39-1.02-.39-1.41 0L10.41 7.14l3.54 3.54 2.03-2.03c.39-.39.39-1.02 0-1.41zM19.22 10.48l-1.41-1.41-3.54 3.54 1.41 1.41c.39.39 1.02.39 1.41 0l2.13-2.13c.39-.39.39-1.02 0-1.41z"/>
            </svg>
            <span>Оспорить</span>
        </button>
        <button class="action-btn">
            <svg viewBox="0 0 24 24">
                <circle cx="8" cy="12" r="5" fill="none" stroke="#4b97f6" stroke-width="2.5"/>
                <circle cx="16" cy="12" r="5" fill="none" stroke="#4b97f6" stroke-width="2.5"/>
                <line x1="8" y1="12" x2="16" y2="12" stroke="#4b97f6" stroke-width="2.5"/>
            </svg>
            <span>Разделить</span>
        </button>
    </div>

    <!-- ТРАНЗАКЦИЯ -->
    <div class="transaction-card">
        <div class="card-header">
            <div class="card-title">Покупка по карте</div>
            <a href="#" class="card-link">Справка</a>
        </div>
        <div class="card-body">
            <div class="thumbnail"><span class="thumbnail-text">1286<br>МИР</span></div>
            <div class="merchant-info">
                <span class="merchant-name">Zarta</span>
                <div class="speaker-icon">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- РЕКОМЕНДАЦИИ -->
    <div class="recommendations-title">Может понравиться</div>
    <div class="recommendations-grid">
        <div class="rec-card blue-card">
            <div class="box-decor"></div>
            <div class="sub-label">ТАБЛЕТКИ ДЛЯ ПОСУДОМОЕЧНЫХ МАШИН</div>
            <div class="title">FINISH QUANTUM POWER ALL IN ONE</div>
            <div class="badge">MEGA VALUE PACK X100</div>
        </div>
        <div class="rec-card white-card">
            <div class="box-decor"></div>
            <div class="sub-label">ТАБЛЕТКИ ДЛЯ ПОСУДОМОЕЧНЫХ МАШИН</div>
            <div class="title">FINISH POWER</div>
            <div class="badge">100 ШТУК</div>
        </div>
    </div>

</div>

<script>
    // --- ЛОГИКА ДАТЫ И ВРЕМЕНИ ---
    const nativeInput = document.getElementById('nativeDateTime');
    const displayText = document.getElementById('displayDateTime');
    const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

    // Установка текущей даты при загрузке
    function setNow() {
        const now = new Date();
        // Форматируем для инпута: YYYY-MM-DDThh:mm
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        
        const dateString = `${year}-${month}-${day}T${hours}:${minutes}`;
        nativeInput.value = dateString;
        updateDisplay(dateString);
    }

    // Обновление текста на экране
    function updateDisplay(val) {
        if (!val) return;
        const d = new Date(val);
        const day = d.getDate();
        const month = months[d.getMonth()];
        const time = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        
        displayText.innerText = `${day} ${month}, ${time}`;
    }

    // Слушаем изменения в инпуте
    nativeInput.addEventListener('change', (e) => {
        updateDisplay(e.target.value);
    });

    // Инициализация
    setNow();

    // --- ЛОГИКА PWA (SERVICE WORKER) ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(registration => {
                    console.log('ServiceWorker зарегистрирован');
                })
                .catch(err => {
                    console.log('Ошибка регистрации ServiceWorker', err);
                });
        });
    }
</script>

</body>
</html>
